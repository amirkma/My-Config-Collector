name: Collect and Update Configs (Hourly)

on:
  schedule:
    - cron: '0 * * * *'           # هر ساعت یک بار
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run config collector
        run: python main.py

      - name: Commit and push if changes exist
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add configs/ || true
          
          # فقط اگر تغییری بود commit و push کن
          git diff --staged --quiet || git commit -m "Hourly auto update configs - $(date '+%Y-%m-%d %H:%M UTC')"
          
          git push origin HEAD:${{ github.ref_name }}
