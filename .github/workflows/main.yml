name: Collect and Update Configs (Hourly)

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas pyyaml

      # 1️⃣ جمع‌آوری کانفیگ‌ها
      - name: Run config collector
        run: python collector.py

      # 2️⃣ ساخت Clash YAML
      - name: Generate Clash config
        run: python generate_clash.py

      # 3️⃣ Commit & Push
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add configs/

          if ! git diff --cached --quiet; then
            git commit -m "chore: hourly update configs ($(date -u '+%Y-%m-%d %H:%M'))"
            git push
          else
            echo "No changes to commit"
          fi
